<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quillmont Sign-in Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap">
<style>
/* Layout: app pages (top bar + content) and Auth0 Universal Login screens (centered 400px card,
   matching the JM Identity Auth0 template spec), then a centered prototype footer.
   Deliberately single-theme (light) so every participant sees the same product. */
:root {
  color-scheme: light;
  --ink: #1d2a26; --ink-2: #4a5853; --ink-3: #6b7873;
  --paper: #f4f3ef; --card: #ffffff; --subtle: #f1f0ec;
  --line: #dfdbd2; --line-strong: #b9b4a8;
  --brand: #1f5c4f; --brand-hover: #174a3f; --brand-soft: #e3efea;
  --protect: #8a4b2a; --protect-soft: #f6e8df;
  --business: #2c4a7a; --business-soft: #e4eaf4;
  --warn: #8a5a12; --warn-soft: #fbf1dd; --warn-line: #ecd6a8;
  --danger: #c0352b; --danger-ink: #a3261f; --success: #2f6b3a; --success-soft: #e5f2e7;
  --font: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --display: "Fraunces", Georgia, "Times New Roman", serif;
  --r: 12px;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.5; }
button, input { font: inherit; }
a { color: var(--brand); }
:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }

/* ── App chrome ── */
.top { background: var(--card); border-bottom: 1px solid var(--line); }
.top-in { max-width: 960px; margin: 0 auto; padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; letter-spacing: -.01em; }
.brand svg { width: 28px; height: 28px; flex: 0 0 auto; }
.app-tag { font-weight: 600; font-size: 13px; padding: 3px 10px; border-radius: 999px; }
.app-tag.protect { background: var(--protect-soft); color: var(--protect); }
.app-tag.business { background: var(--business-soft); color: var(--business); }
.who { font-size: 14px; color: var(--ink-2); display: flex; align-items: center; gap: 8px; min-width: 0; }
.who b { font-weight: 600; color: var(--ink); overflow-wrap: anywhere; }
.avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--brand-soft); color: var(--brand); display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; flex: 0 0 auto; }
main { padding-block: 32px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 10px 18px; border-radius: 10px; border: 1px solid transparent; font-weight: 600; font-size: 16px; cursor: pointer; text-decoration: none; }
.btn-primary { background: var(--brand); color: #fff; }
.btn-primary:hover { background: var(--brand-hover); }
.btn-secondary { background: var(--card); color: var(--brand); border-color: var(--line-strong); }
.btn-secondary:hover { background: var(--brand-soft); }
.btn-link { background: none; border: none; color: var(--brand); padding: 4px; min-height: 44px; font-weight: 600; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.small { font-size: 14px; color: var(--ink-2); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-weight: 600; font-size: 14px; }
.field .hint { font-size: 13px; color: var(--ink-3); }
.input { width: 100%; padding: 12px 14px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--card); color: var(--ink); font-size: 16px; }
.input:focus { border-color: var(--brand); outline: 3px solid var(--brand-soft); outline-offset: 0; }
.err { color: var(--danger-ink); font-size: 14px; margin: 0; }
.notice { display: flex; gap: 12px; padding: 14px; border-radius: 10px; background: var(--warn-soft); border: 1px solid var(--warn-line); color: var(--ink); font-size: 15px; }
.notice svg { flex: 0 0 auto; width: 20px; height: 20px; color: var(--warn); margin-top: 2px; }
.notice strong { display: block; }
.notice .btn-link { min-height: 0; padding: 0; }
.invite-card { max-width: 600px; margin: 0 auto; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 32px; display: flex; flex-direction: column; gap: 24px; }
@media (max-width: 520px) { .invite-card { padding: 24px 20px; } }
.invite-card h1 { margin: 0; font-family: var(--display); font-weight: 600; font-size: 28px; line-height: 1.2; }
.invite-card .lede { margin: 8px 0 0; color: var(--ink-2); }
.invite-form { display: flex; flex-direction: column; gap: 20px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px 16px; }
@media (max-width: 520px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
.grid2 .span2 { grid-column: 1 / -1; }
.field .optional { font-weight: 400; color: var(--ink-3); }
.input[readonly] { background: var(--subtle); color: var(--ink-2); }
.field.is-invalid .input, .field.is-invalid .phone-group { border-color: var(--danger); }
.phone-group { display: flex; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--card); overflow: hidden; }
.phone-group:focus-within { border-color: var(--brand); outline: 3px solid var(--brand-soft); }
.phone-group select { border: 0; border-right: 1px solid var(--line); background: var(--subtle); color: var(--ink); padding: 0 10px 0 12px; font-size: 16px; cursor: pointer; }
.phone-group .input { border: 0; border-radius: 0; outline: none; }
.phone-group .input:focus { outline: none; }
.checks { display: flex; flex-direction: column; gap: 16px; }
.check { display: flex; gap: 12px; align-items: flex-start; font-size: 14px; line-height: 1.5; cursor: pointer; }
.check input { width: 20px; height: 20px; margin: 1px 0 0; flex: 0 0 auto; accent-color: var(--brand); }
.check.is-invalid { color: var(--danger-ink); }

.page { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.page h1 { margin: 0; font-family: var(--display); font-weight: 600; font-size: 30px; line-height: 1.2; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; display: flex; flex-direction: column; gap: 12px; }
.panel h2 { margin: 0; font-size: 18px; }
.panel-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.btn-sm { min-height: 40px; padding: 6px 14px; font-size: 14px; }
.rows { display: flex; flex-direction: column; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding-block: 14px; border-top: 1px solid var(--line); }
.rows .row:first-child { border-top: 0; padding-top: 4px; }
.rows .row:last-child { padding-bottom: 0; }
.row .k { color: var(--ink-2); font-size: 14px; }
.row .v { font-weight: 600; overflow-wrap: anywhere; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 6px; }
.tile span { font-size: 14px; color: var(--ink-2); }
.empty { text-align: center; padding: 28px 16px; }
.empty svg { width: 44px; height: 44px; color: var(--ink-3); }
.hero { display: grid; gap: 24px; max-width: 880px; margin: 0 auto; align-items: center; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 760px) { .hero { grid-template-columns: 1.1fr .9fr; } }
.hero h1 { font-family: var(--display); font-weight: 600; font-size: clamp(32px, 5vw, 44px); line-height: 1.1; margin: 0; text-wrap: balance; }
.hero p { margin: 0; color: var(--ink-2); font-size: 18px; max-width: 46ch; }
.hero .art { border-radius: 16px; aspect-ratio: 4 / 3; max-width: 100%; display: flex; align-items: center; justify-content: center; }
.hero .art.protect { background: var(--protect-soft); color: var(--protect); }
.hero .art.business { background: var(--business-soft); color: var(--business); }
.hero .art svg { width: 45%; height: auto; }
.hero .cta { display: flex; gap: 10px; flex-wrap: wrap; }
.inbox { max-width: 640px; margin: 0 auto; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.inbox-head { padding: 12px 16px; border-bottom: 1px solid var(--line); font-size: 14px; color: var(--ink-2); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
.mail { padding: 20px; display: flex; flex-direction: column; gap: 12px; }
.mail .from { font-size: 14px; color: var(--ink-2); }
.mail h2 { margin: 0; font-size: 20px; }

/* ── Auth0 Universal Login (per the JM Identity Auth0 template spec) ── */
.a0-page { display: flex; flex-direction: column; align-items: center; padding-block: 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.a0-card { width: 100%; max-width: 400px; padding: 32px 24px; background: var(--card); border-radius: 12px; box-shadow: 0 12px 40px rgba(29,42,38,.12), 0 2px 6px rgba(29,42,38,.06); }
.a0-logo { display: flex; justify-content: center; margin: 0 0 24px; }
.a0-logo svg { display: block; height: 56px; width: 168px; }
.a0-title { font-family: var(--font); font-size: 24px; font-weight: 400; line-height: 1.25; margin: 0 0 24px; text-align: center; color: var(--ink); }
.a0-desc { font-size: 14px; line-height: 1.5; color: var(--ink-2); margin: 0 0 24px; text-align: center; }
.a0-desc strong { color: var(--ink); font-weight: 600; overflow-wrap: anywhere; }
.a0-form { display: flex; flex-direction: column; gap: 12px; margin: 0; }
.a0-actions { display: flex; flex-direction: column; gap: 16px; margin-top: 12px; }
.a0-field { position: relative; }
.a0-input { width: 100%; height: 52px; padding: 18px 16px 6px; font-family: var(--font); font-size: 16px; color: var(--ink); background: var(--card); border: 1px solid var(--line-strong); border-radius: 8px; outline: none; -webkit-appearance: none; }
.a0-input:hover { border-color: var(--ink-3); }
.a0-input:focus { border-color: var(--brand); outline: 2px solid var(--brand); outline-offset: 0; }
.a0-field.has-trailing .a0-input { padding-right: 64px; }
.a0-label { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); font-size: 16px; color: var(--ink-3); pointer-events: none; transition: top .15s, font-size .15s, transform .15s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: calc(100% - 32px); }
.a0-input:focus + .a0-label, .a0-input:not(:placeholder-shown) + .a0-label { top: 7px; transform: none; font-size: 12px; }
.a0-input:focus + .a0-label { color: var(--brand); }
.a0-input[readonly] { background: var(--subtle); border-color: var(--line); padding-top: 6px; }
.a0-trailing { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); min-width: 36px; height: 36px; padding: 0 8px; background: none; border: 0; border-radius: 8px; color: var(--brand); cursor: pointer; font-size: 14px; font-weight: 700; }
.a0-field.is-invalid .a0-input { border-color: var(--danger); }
.a0-field.is-invalid .a0-label { color: var(--danger-ink); }
.a0-error { margin: -8px 0 0; font-size: 12px; color: var(--danger-ink); }
.a0-btn { display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; height: 52px; padding: 0 16px; font-family: var(--font); font-size: 16px; font-weight: 400; border-radius: 8px; cursor: pointer; text-decoration: none; }
.a0-btn-primary { background: var(--brand); color: #fff; border: 1px solid var(--brand); }
.a0-btn-primary:hover { background: var(--brand-hover); border-color: var(--brand-hover); }
.a0-btn-outline { background: var(--card); color: var(--brand); border: 1px solid var(--brand); }
.a0-btn-outline:hover { background: var(--brand-soft); }
.a0-link { background: none; border: 0; padding: 0; cursor: pointer; font-family: var(--font); font-size: 14px; font-weight: 700; color: var(--brand); text-decoration: none; }
.a0-link:hover { text-decoration: underline; }
.a0-meta { margin: 0; font-size: 14px; color: var(--ink-2); text-align: center; }
.a0-meta-sm { margin: 0; font-size: 12px; color: var(--ink-2); text-align: center; }
.a0-meta-sm .a0-link { font-size: 12px; }
.a0-alt { text-align: center; margin: 24px 0 0; }
.a0-forgot { margin: 0; text-align: left; }
.a0-alert { margin: 0 0 12px; padding: 12px; border-radius: 8px; font-size: 14px; line-height: 1.5; }
.a0-alert-danger { background: var(--danger); color: #fff; }
.a0-alert-success { background: var(--success-soft); color: var(--success); }
.a0-policy { margin: 0; padding: 12px 16px; border: 1px solid var(--line-strong); border-radius: 8px; font-size: 14px; color: var(--ink-2); }
.a0-policy p { margin: 0 0 8px; }
.a0-policy ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.a0-policy ul ul { margin-top: 8px; padding-left: 24px; }
.a0-policy li > span { display: flex; align-items: flex-start; gap: 8px; line-height: 1.5; }
.a0-policy .dot { width: 18px; height: 18px; flex: 0 0 auto; margin-top: 2px; border-radius: 50%; border: 1.5px solid var(--line-strong); display: inline-flex; align-items: center; justify-content: center; font-size: 11px; color: transparent; }
.a0-policy li.is-met > span { color: var(--success); }
.a0-policy li.is-met > span .dot { border-color: var(--success); background: var(--success); color: #fff; }
.a0-policy.is-invalid { border-color: var(--danger); }
.a0-policy.is-invalid li:not(.is-met) > span { color: var(--danger-ink); }
.a0-value { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 12px 8px 12px 16px; background: var(--subtle); border: 1px solid var(--line); border-radius: 8px; font-size: 16px; }
.a0-value-text { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.a0-result { text-align: center; }
.a0-result-icon { width: 64px; height: 64px; margin: 0 auto 16px; border-radius: 50%; background: var(--brand-soft); color: var(--brand); display: flex; align-items: center; justify-content: center; }
.a0-result-icon svg { width: 32px; height: 32px; }
.a0-otp { letter-spacing: .3em; }
.a0-options { display: flex; flex-direction: column; gap: 12px; }
.a0-option { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 64px; padding: 12px 16px; background: var(--card); border: 1px solid var(--line-strong); border-radius: 8px; cursor: pointer; text-align: left; font-family: var(--font); font-size: 16px; line-height: 1.35; color: var(--ink); }
.a0-option:hover { border-color: var(--brand); background: var(--brand-soft); }
.a0-option .ic { width: 40px; height: 40px; border-radius: 8px; background: var(--brand-soft); color: var(--brand); display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
.a0-option .ic svg { width: 20px; height: 20px; }
.a0-option .lbl { flex: 1; min-width: 0; }
.a0-option .chev { width: 18px; height: 18px; color: var(--ink-3); flex: 0 0 auto; }
.a0-qr { display: flex; justify-content: center; margin: 0 0 16px; }
.a0-qr svg { width: 176px; height: 176px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
.a0-secret { text-align: center; font-size: 13px; color: var(--ink-2); margin: 0 0 20px; }
.a0-secret code { display: block; margin-top: 4px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--ink); letter-spacing: .08em; font-size: 14px; }
.a0-wait { display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 14px; color: var(--ink-2); min-height: 52px; }
.a0-spin { width: 18px; height: 18px; border: 2px solid var(--line-strong); border-top-color: var(--brand); border-radius: 50%; animation: a0spin .8s linear infinite; }
@keyframes a0spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .a0-spin { animation: none; } }

/* ── Mobile task: phone-sized frame on wide screens, full screen on a real phone ── */
.device-wrap { padding: 24px 16px; }
.device { position: relative; background: var(--paper); }
@media (min-width: 600px) { .device { width: 390px; height: 780px; margin: 0 auto; border: 10px solid var(--ink); border-radius: 44px; overflow: auto; } }
.device .hero { grid-template-columns: minmax(0, 1fr); }
.device .hero h1 { font-size: 30px; }
.device .a0-card { box-shadow: none; padding-inline: 16px; }
.device .a0-page { padding-block: 16px; }
.banner { position: sticky; top: 8px; z-index: 5; margin: 8px; background: rgba(255,255,255,.97); border: 1px solid var(--line); box-shadow: 0 8px 24px rgba(29,42,38,.18); border-radius: 16px; padding: 10px 12px; display: flex; gap: 10px; align-items: flex-start; width: calc(100% - 16px); text-align: left; cursor: pointer; font: inherit; color: var(--ink); }
.banner .ico { width: 34px; height: 34px; border-radius: 9px; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 13px; }
.banner .ico.msg { background: #2f8f4e; }
.banner .ico.mail { background: #2c6bd1; }
.banner .meta { font-size: 12px; color: var(--ink-3); display: flex; justify-content: space-between; }
.banner .txt { font-size: 14px; }
.suggest { display: flex; justify-content: center; }
.suggest button { border: 1px solid var(--line-strong); background: var(--card); border-radius: 999px; padding: 8px 16px; min-height: 44px; font-size: 15px; cursor: pointer; color: var(--ink); }
.suggest small { display: block; font-size: 12px; color: var(--ink-3); }
.mailapp { display: flex; flex-direction: column; gap: 14px; }
.mailapp .back { align-self: flex-start; }
.mailapp .code { font-size: 34px; font-weight: 700; letter-spacing: .2em; text-align: center; padding: 16px; background: var(--paper); border-radius: 12px; }

/* ── Closing comparison + researcher index ── */
.compare { max-width: 900px; margin: 0 auto; display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.compare .a0-card { max-width: none; }
.opt { font-weight: 700; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); text-align: center; margin-bottom: 8px; }
.index { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.index h1 { font-family: var(--display); font-weight: 600; font-size: 30px; margin: 0; }
.index table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; font-size: 14px; }
.index th, .index td { text-align: left; padding: 12px 16px; border-top: 1px solid var(--line); vertical-align: top; }
.index th { background: var(--paper); font-size: 12px; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-2); border-top: 0; }
.index .scroll { overflow-x: auto; }
.index .task-note { margin: 6px 0 0; color: var(--ink-2); font-size: 14px; line-height: 1.5; max-width: 62ch; }
.index td { padding-block: 16px; }
.index td:last-child { white-space: nowrap; }
.index code { font-size: 13px; background: var(--paper); padding: 1px 6px; border-radius: 6px; }

.brief { background: #fff7e0; border-bottom: 1px solid #ecd6a8; color: var(--ink); }
.brief-in { max-width: 960px; margin: 0 auto; padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; font-size: 14px; }
.brief-cols { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 4px 48px; min-width: 0; }
.brief-cols dl { align-content: start; }
.brief dl .pair { display: contents; }
@media (max-width: 480px) { .brief-cols dl:last-child { display: flex; flex-wrap: wrap; gap: 0 24px; } .brief-cols dl:last-child .pair { display: block; } }
.brief-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.brief-head b { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--warn); }
.brief-toggle { flex: 0 0 auto; white-space: nowrap; background: none; border: 0; color: var(--warn); font-weight: 600; font-size: 13px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; min-height: 32px; padding: 0 4px; }
.brief p { margin: 0; max-width: 72ch; }
.brief .task-line { font-weight: 600; }
.brief dl { margin: 0; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 2px 12px; }
.brief dt { color: var(--ink-2); }
@media (max-width: 480px) { .brief dl { grid-template-columns: minmax(0, 1fr); gap: 0; } .brief dd { margin-bottom: 4px; } }
.brief dl { align-items: center; }
.brief dd { display: flex; align-items: center; gap: 4px; }
.copy-btn { display: inline-flex; align-items: center; justify-content: center; gap: 4px; min-width: 32px; height: 32px; padding: 0 6px; border: 0; border-radius: 6px; background: none; color: var(--warn); cursor: pointer; font-size: 12px; font-weight: 600; }
.copy-btn:hover { background: rgba(138,90,18,.1); }
.copy-btn svg { width: 16px; height: 16px; }
.row .k small { display: block; font-size: 13px; color: var(--ink-3); }
.brief dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
.brief dd span { user-select: all; min-width: 0; }

.proto-foot .foot-btn { background: none; border: 1px solid var(--line-strong); border-radius: 8px; padding: 6px 12px; color: var(--ink-2); cursor: pointer; font-size: 13px; min-height: 36px; }
.proto-foot .foot-link { background: none; border: none; padding: 4px; color: var(--ink-3); text-decoration: underline; text-underline-offset: 3px; font-size: 13px; cursor: pointer; }
</style>

<script>
(function () {
  // ── Scenario data ────────────────────────────────────────────────
  var JORDAN_PHONE = '5555550123', SAM_PHONE = '5555550123';
  var WORK = 'jane@mapleandmaingoods.com', SAM_PERSONAL = 'jane.smith@gmail.com';
  var SCENARIOS = {
    'consumer-1': { label: 'Consumer · Task 1 · Sign up (baseline)', app: 'protect', start: 'landing', accounts: [] },
    'consumer-2': { label: 'Consumer · Task 2 · Shared household phone', app: 'protect', start: 'landing',
      accounts: [{ phone: JORDAN_PHONE, email: 'alex.smith@gmail.com', mine: false }] },
    'consumer-3': { label: 'Consumer · Task 3 · Old account, phone added later', app: 'protect', start: 'landing',
      accounts: [{ phone: JORDAN_PHONE, email: 'jsmith84@yahoo.com', mine: true }] },
    'consumer-4': { label: 'Consumer · Task 4 · Sign up on your phone', app: 'protect', start: 'landing', mobile: true, accounts: [] },
    'business-a-1': { label: 'Business A · Task 1 · Insure your laptop', app: 'protect', start: 'landing', accounts: [] },
    'business-a-2': { label: 'Business A · Task 2 · Sign up for Quillmont Business', app: 'business', start: 'landing',
      accounts: [{ phone: SAM_PHONE, email: SAM_PERSONAL, mine: true }] },
    'business-a-3': { label: 'Business A · Task 3 · Accept an invite', app: 'business', start: 'invite',
      accounts: [{ phone: SAM_PHONE, email: SAM_PERSONAL, mine: true }] },
    'business-b-1': { label: 'Business B · Task 1 · Sign up for Quillmont Business', app: 'business', start: 'landing', accounts: [] },
    'business-b-2': { label: 'Business B · Task 2 · Insure your laptop', app: 'protect', start: 'landing',
      accounts: [{ phone: SAM_PHONE, email: WORK, mine: true, org: true }] },
    'business-b-3': { label: 'Business B · Task 3 · Sign in later', app: 'business', start: 'landing',
      accounts: [{ phone: SAM_PHONE, email: SAM_PERSONAL, mine: true }, { phone: null, email: WORK, mine: true, org: true }] },
    'compare': { label: 'Closing · Compare sign-up screens', app: null, start: 'compare', accounts: [] }
  };
  var APPS = {
    protect: { name: 'Quillmont Protect', tag: 'Protect', headline: 'Protect the things you use every day.', blurb: 'Cover your laptop, phone, bike or camera against damage and theft, from about $6 a month.', icon: 'i-laptop' },
    business: { name: 'Quillmont Business', tag: 'Business', headline: 'Shipping and team tools for small businesses.', blurb: 'Buy discounted shipping labels, manage orders and give your team their own logins.', icon: 'i-box' }
  };
  var CODE_ROW = ['Any passcode', '123123'];
  var JORDAN = [['Cell phone', '(555) 555-0123'], ['Email', 'john.smith@gmail.com'], ['Password', 'BlueHarbor-2026!'], CODE_ROW];
  var SAM = [['Cell phone (only phone)', '(555) 555-0123'], ['Personal email', 'jane.smith@gmail.com'], ['Work email', 'jane@mapleandmaingoods.com'], ['Password', 'BlueHarbor-2026!'], CODE_ROW];
  var SAM_LOGIN = SAM.slice(0, 4);
  var BRIEFS = {
    'consumer-1': { story: 'You’re John. You just bought a new laptop and want to protect it.', task: 'Create an account so you can protect your laptop. Stop when you reach the home screen.', details: JORDAN },
    'consumer-2': { story: 'You’re John. You live with your partner, Alex, and you both use the same household phone number. Last year Alex covered her phone with Quillmont Protect. Now you want to cover your own laptop.', task: 'Create your own account to cover your laptop. Then add your cell phone to your account so the app can text you.', details: [['Shared phone', '(555) 555-0123'], ['Your email', 'john.smith@gmail.com'], ['Password', 'BlueHarbor-2026!'], CODE_ROW] },
    'consumer-3': { story: 'You’re John. A few years ago you made a Quillmont account for an old policy using your cell phone, and you’ve forgotten about it. Today you’re signing up for Quillmont Protect.', task: 'Sign up with your email. Then add your cell phone to your account so the app can text you.', details: JORDAN },
    'consumer-4': { story: 'You’re John, setting up Quillmont Protect on your phone for the first time.', task: 'Create an account and confirm it. Stop when you reach the home screen.', details: JORDAN },
    'business-a-1': { story: 'You’re Jane. You work at Maple & Main Goods, a small shop.', task: 'You want to protect your personal laptop. Create an account in Quillmont Protect. Stop when you reach the home screen.', details: SAM },
    'business-a-2': { story: 'You’re Jane. You work at Maple & Main Goods, a small shop.', task: 'Your manager asks you to create a Quillmont Business account so you can buy shipping labels for the shop. Create your account. Then add your cell phone to your account so the app can text you.', details: SAM },
    'business-a-3': { story: 'You’re Jane. Priya, the shop’s owner, invited you to Maple & Main Goods’ Quillmont Business account. The invite went to your work email.', task: 'Open the invite email and join your shop’s Quillmont Business account.', details: SAM.slice(0, 3).concat([['Name', 'Jane Smith']], SAM.slice(3)) },
    'business-b-1': { story: 'You’re Jane. You work at Maple & Main Goods, a small shop.', task: 'Your manager asks you to create a Quillmont Business account so you can buy shipping labels for the shop. Create your account. Stop when you reach the home screen.', details: SAM },
    'business-b-2': { story: 'You’re Jane. You work at Maple & Main Goods, a small shop.', task: 'You want to protect your personal laptop. Create an account in Quillmont Protect. Then add your cell phone to your account so the app can text you.', details: SAM },
    'business-b-3': { story: 'You’re Jane. Last month Priya invited you to Quillmont Business at your work email, and you joined. You also have a Quillmont Protect account from before, set up with your cell phone. Today you want to buy shipping labels.', task: 'Sign in to Quillmont Business.', details: SAM_LOGIN }
  };
  var INDEX_NOTES = {
    'consumer-1': 'Sign up for Protect and reach the home screen. No existing accounts, so nothing goes wrong. Shows which identifier people pick first.',
    'consumer-2': 'Sign up for Protect, then add a cell phone. The partner already used the shared phone, so it’s taken either at sign-up or when adding it later.',
    'consumer-3': 'Sign up with email, then add a cell phone. A forgotten old account already has the phone, so adding it says it’s taken.',
    'consumer-4': 'Sign up for Protect on a phone and confirm with a text or email code. Compares the two ways of confirming.',
    'business-a-1': 'Sign up for Protect as a personal customer and reach the home screen. Sets up the personal account the next tasks run into.',
    'business-a-2': 'Sign up for Business for work, then add a cell phone. The phone is already on the personal account from task 1.',
    'business-a-3': 'Accept an invite sent to the work email. The app’s details screen asks for name and mobile number, and the phone is already on the personal account, so it flags the existing account there.',
    'business-b-1': 'Sign up for Business with the work email and reach the home screen. Sets up the work account the next tasks run into.',
    'business-b-2': 'Sign up for Protect as a personal customer, then add a cell phone. The phone is already on the work account from task 1.',
    'business-b-3': 'Sign in to Business. Signing in with the phone opens the personal account, which has no business. The work email opens the shop.',
    'compare': 'Closing question for all three tests. Shows the combined sign-up field beside an email-only one.'
  };
  var briefOpen = true;
  function brief() {
    var b = BRIEFS[S.key]; if (!b) return '';
    function dl(rows) { return '<dl>' + rows.map(function (d) { return '<div class="pair"><dt>' + esc(d[0]) + '</dt><dd><span>' + esc(d[1]) + '</span><button type="button" class="copy-btn" data-act="copy" data-val="' + esc(d[1]) + '" aria-label="Copy ' + esc(d[0].toLowerCase()) + '"><svg aria-hidden="true"><use href="#i-copy"/></svg></button></dd></div>'; }).join('') + '</dl>'; }
    var secret = function (d) { return d[0] === 'Name' || d[0] === 'Password' || d[0] === 'Any passcode'; };
    var toggle = '<button type="button" class="brief-toggle" data-act="brief" aria-expanded="' + briefOpen + '">' + (briefOpen ? 'Hide' : 'Show your details') + '</button>';
    var body = briefOpen ? '<div class="brief-cols">' + dl(b.details.filter(function (d) { return !secret(d); })) + dl(b.details.filter(secret)) + '</div>' : '<span></span>';
    return '<aside class="brief" aria-label="Your details"><div class="brief-in">' + body + toggle + '</div></aside>';
  }
  var CODE = '123123', CODES = { sms: CODE, email: CODE };
  // The MFA method the participant chose in their most recent sign-up, kept across tasks so later
  // log-ins (including into accounts that existed before the task) challenge with that method.
  var LAST_MFA = null;
  try { LAST_MFA = JSON.parse(localStorage.getItem('quillmont-last-mfa') || 'null'); } catch (err) {}
  function saveLastMfa(m) { LAST_MFA = m; try { localStorage.setItem('quillmont-last-mfa', JSON.stringify(m)); } catch (err) {} }
  function mfaFor(acct) {
    var m = acct.mfa || LAST_MFA || { method: 'sms' };
    var phone = m.phone || acct.phone;
    if (m.method === 'sms' && !phone) return { method: 'otp' };
    return { method: m.method, phone: phone };
  }
  var RULES = [['length', 'At least 16 characters in length'], ['three', 'At least 3 of the following:'], ['lower', 'Lower case letters (a-z)'], ['upper', 'Upper case letters (A-Z)'], ['number', 'Numbers (0-9)'], ['special', 'Special characters (ex. !@#)'], ['repeat', 'No more than 2 identical characters in a row']];

  // ── State ────────────────────────────────────────────────────────
  var S, bannerTimer;
  var fromIndex = !SCENARIOS[(location.hash || '').slice(1)];
  function reset(key) {
    clearTimeout(bannerTimer);
    var sc = SCENARIOS[key] || null;
    S = { key: sc ? key : null, sc: sc || {}, app: sc && sc.app, screen: sc ? sc.start : 'index',
          accounts: sc ? sc.accounts.map(function (a) { return Object.assign({}, a); }) : [],
          ident: '', idType: '', match: null, pending: {}, current: null, alert: '', fieldErr: '', policyBad: false,
          banner: false, otpChannel: '', codeValue: '', codeFilled: false, invite: false, settingsMsg: '', loginIdent: '' };
    render();
  }

  // ── Helpers ──────────────────────────────────────────────────────
  var app = document.getElementById('app');
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function digits(s) { var d = String(s).replace(/\D/g, ''); if (d.length === 11 && d[0] === '1') d = d.slice(1); return d; }
  function kind(v) { v = String(v).trim(); if (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) return 'email'; if (digits(v).length === 10 && /^[\d\s().+-]+$/.test(v)) return 'phone'; return ''; }
  function fmtPhone(d) { return '(' + d.slice(0, 3) + ') ' + d.slice(3, 6) + '-' + d.slice(6); }
  function shown(v) { return kind(v) === 'phone' ? fmtPhone(digits(v)) : String(v).trim(); }
  function find(type, v) { var n = type === 'phone' ? digits(v) : String(v).trim().toLowerCase(); return S.accounts.filter(function (a) { return type === 'phone' ? a.phone === n : (a.email || '').toLowerCase() === n; })[0] || null; }
  function loginOf(a) { return a.email || (a.phone ? fmtPhone(a.phone) : ''); }
  function appName() { return APPS[S.app].name; }
  function go(screen) { S.screen = screen; S.alert = ''; S.fieldErr = ''; S.policyBad = false; render(); }
  function rules(pw) {
    var kinds = [/[a-z]/.test(pw), /[A-Z]/.test(pw), /\d/.test(pw), /[^A-Za-z0-9]/.test(pw)];
    return { length: pw.length >= 16, lower: kinds[0], upper: kinds[1], number: kinds[2], special: kinds[3], three: kinds.filter(Boolean).length >= 3, repeat: pw.length > 0 && !/(.)\1\1/.test(pw) };
  }
  function pwOk(pw) { var r = rules(pw); return r.length && r.three && r.repeat; }

  // Auth0 building blocks
  function card(inner, extra) { return '<div class="a0-page"><section class="a0-card' + (extra || '') + '"><div class="a0-logo"><svg role="img" aria-label="Quillmont"><use href="#wordmark"/></svg></div>' + inner + '</section></div>'; }
  function alertHtml() { return S.alert ? '<div class="a0-alert a0-alert-danger" role="alert">' + S.alert + '</div>' : ''; }
  function field(id, label, opts) {
    opts = opts || {};
    var bad = S.fieldErr && opts.err !== false;
    return '<div class="a0-field' + (bad ? ' is-invalid' : '') + (opts.trailing ? ' has-trailing' : '') + '"><input class="a0-input' + (opts.cls ? ' ' + opts.cls : '') + '" id="' + id + '" placeholder=" " ' + (opts.attrs || '') + ' value="' + esc(opts.value || '') + '"' + (opts.readonly ? ' readonly aria-label="' + esc(label) + '"' : '') + (bad ? ' aria-invalid="true" aria-describedby="' + id + '-err"' : '') + '>' +
      (opts.readonly ? '' : '<label class="a0-label" for="' + id + '">' + label + '</label>') + (opts.trailing || '') + '</div>' + (bad ? '<p class="a0-error" id="' + id + '-err">' + esc(S.fieldErr) + '</p>' : '');
  }
  function readonlyIdent(value, backTo) { return field('ro', 'Account', { readonly: true, value: value, err: false, trailing: backTo ? '<button class="a0-trailing" type="button" data-act="' + backTo + '">Edit</button>' : '' }); }
  function pwField(id, label) { return field(id, label, { attrs: 'type="password" autocomplete="' + (id === 'loginpw' ? 'current-password' : 'new-password') + '"', trailing: '<button class="a0-trailing" type="button" data-act="toggle-pw" data-for="' + id + '" aria-label="Show password" aria-pressed="false">Show</button>' }); }
  function policyHtml(pw) {
    var r = rules(pw || '');
    function li(k, label, inner) { return '<li class="' + (r[k] ? 'is-met' : '') + '" data-rule="' + k + '"><span><span class="dot" aria-hidden="true">✓</span>' + label + '</span>' + (inner || '') + '</li>'; }
    return '<div class="a0-policy' + (S.policyBad ? ' is-invalid' : '') + '" id="policy" aria-live="polite"><p>Your password must contain:</p><ul>' + li('length', RULES[0][1]) +
      li('three', RULES[1][1], '<ul>' + li('lower', RULES[2][1]) + li('upper', RULES[3][1]) + li('number', RULES[4][1]) + li('special', RULES[5][1]) + '</ul>') + li('repeat', RULES[6][1]) + '</ul></div>';
  }

  function topbar() {
    var a = APPS[S.app];
    var who = S.current ? '<div class="who"><span class="avatar" aria-hidden="true">' + esc(S.current.email ? S.current.email[0].toUpperCase() : '#') + '</span><span>Signed in as <b>' + esc(loginOf(S.current)) + '</b></span></div>' : '';
    return '<header class="top"><div class="top-in"><div class="brand"><svg aria-hidden="true"><use href="#shield"/></svg>Quillmont' + (a ? ' <span class="app-tag ' + S.app + '">' + a.tag + '</span>' : '') + '</div>' + who + '</div></header>';
  }
  function foot() {
    if (!S.key) return '';
    return '<footer class="proto-foot"><span>Prototype for a research study</span>' +
      (S.key !== 'compare' ? '<button type="button" class="foot-btn" data-act="restart">Start this task over</button>' : '') +
      (fromIndex ? '<button type="button" class="foot-link" data-act="index">All tasks</button>' : '') + '</footer>';
  }
  var AUTH = { mfaChallenge: 1, signup: 1, signupPw: 1, verify: 1, mfaOptions: 1, mfaSms: 1, mfaOtp: 1, mfaKey: 1, mfaDone: 1, login: 1, loginPw: 1, resetRequest: 1, resetEmail: 1, acceptInvite: 1, support: 1 };

  // ── Screens ──────────────────────────────────────────────────────
  var V = {};
  V.index = function () {
    var rows = Object.keys(SCENARIOS).map(function (k) { return '<tr><td><button type="button" class="btn-link" style="min-height:0;padding:0;text-align:left" data-act="open" data-key="' + k + '">' + esc(SCENARIOS[k].label) + '</button><p class="task-note">' + esc(INDEX_NOTES[k] || '') + '</p></td><td><code>#' + k + '</code></td></tr>'; }).join('');
    return '<main><div class="index"><h1>Quillmont prototype: task links</h1><p class="small">For the researcher. Give each UserTesting task the page link plus its code, for example <code>…/quillmont-prototype.html#consumer-2</code>. Each link starts that task fresh with the right existing accounts. Personas use the password <code>BlueHarbor-2026!</code>, and any password works for their own existing accounts. Every sign-up verifies the phone or email, then requires MFA setup. Every log-in asks for MFA after the password, using the method the participant chose in their most recent sign-up (a text code if they haven’t signed up yet). Every code is <code>123123</code>.</p><div class="scroll"><table><thead><tr><th>Task</th><th>Link code</th></tr></thead><tbody>' + rows + '</tbody></table></div></div></main>';
  };
  V.landing = function () {
    var a = APPS[S.app];
    return '<main><section class="hero"><div class="stack" style="gap:18px"><h1>' + a.headline + '</h1><p>' + a.blurb + '</p><div class="cta"><button class="btn btn-primary" data-act="to-signup">Get started</button><button class="btn btn-secondary" data-act="to-login">Log in</button></div></div>' +
      '<div class="art ' + S.app + '" aria-hidden="true"><svg><use href="#' + a.icon + '"/></svg></div></section></main>';
  };
  // signup-id (combined field kept on purpose; Auth0 renders one field per identifier)
  V.signup = function () {
    return card('<h1 class="a0-title">' + appName() + '</h1><p class="a0-desc">Sign up to Quillmont to continue to ' + appName() + '.</p>' + alertHtml() +
      '<form class="a0-form" data-form="signup" novalidate>' + field('ident', 'Phone or email*', { attrs: 'type="text" autocomplete="username"', value: S.ident }) +
      '<div class="a0-actions"><button class="a0-btn a0-btn-primary" type="submit">Continue</button><p class="a0-meta">Already have an account? <button class="a0-link" type="button" data-act="to-login">Log in</button></p></div></form>');
  };
  // signup-password
  V.signupPw = function () {
    var ident = S.invite ? WORK : shown(S.ident);
    return card('<h1 class="a0-title">' + appName() + '</h1><p class="a0-desc">Set your password for Quillmont to continue to ' + appName() + '.</p>' +
      '<form class="a0-form" data-form="signupPw" novalidate>' + readonlyIdent(ident, S.invite ? '' : 'to-signup') + pwField('pw', 'Password*') + pwField('pw2', 'Re-enter your password*') +

    if (S.screen === 'verify' && S.banner) {

        ? '<div class="banner" role="status"><span class="ico msg" aria-hidden="true">✉</span><span><span class="meta"><span>Messages</span><span>now</span></span><span class="txt"><b>Quillmont</b><br>Your Quillmont code is ' + CODE + '. Don’t share it.</span></span></div>'
        : '<button type="button" class="banner" data-act="open-mail"><span class="ico mail" aria-hidden="true">@</span><span><span class="meta"><span>Mail</span><span>now</span></span><span class="txt"><b>Quillmont</b><br>Your verification code</span></span></button>';
    }
    var inner = chrome + bannerHtml + view() + foot();
    app.innerHTML = brief() + (S.sc.mobile ? '<div class="device-wrap"><div class="device" aria-label="Phone screen">' + inner + '</div></div>' : inner);
    var focus = app.querySelector('[aria-invalid="true"]') || (AUTH[S.screen] ? app.querySelector('.a0-input:not([readonly])') : null);
    if (focus) focus.focus();
    var pw = document.getElementById('pw');
    if (pw) pw.addEventListener('input', function () { S.pwDraft = pw.value; var pol = document.getElementById('policy'); if (pol) pol.outerHTML = policyHtml(pw.value); });
    window.scrollTo(0, 0);
  }
  function login(acct) { S.current = acct; S.invite = false; go('home'); }
  function startVerify(purpose) {
    S.verifyPurpose = purpose; S.codeValue = ''; S.codeFilled = false; S.banner = false; go('verify');
    if (!S.sc.mobile) return;
    clearTimeout(bannerTimer);
    bannerTimer = setTimeout(function () { if (S.screen === 'verify') { var cur = document.getElementById('code'); S.codeValue = cur ? cur.value : S.codeValue; S.banner = true; render(); } }, 1500);
  }
  function createAccount() {
    var a = { phone: S.pending.phone || null, email: S.pending.email || null, mine: true, org: !!S.invite, mfa: S.mfaMethod ? { method: S.mfaMethod, phone: S.mfaMethod === 'sms' ? S.mfaPhone : null } : null };
    S.accounts.push(a); return login(a);
  }

  // Continue buttons and Enter are handled directly, never through native form submission,
  // which sandboxed viewers (like the Claude artifact viewer) can block.
  app.addEventListener('click', function (e) {
    var sb = e.target.closest('form button[type=submit]');
    if (sb) { e.preventDefault(); return onSubmit(sb.closest('form')); }
    var b = e.target.closest('[data-act]'); if (!b) return;
    var act = b.getAttribute('data-act'); e.preventDefault();
    if (act === 'copy') {
      var val = b.getAttribute('data-val');
      var done = function () { b.innerHTML = '<svg aria-hidden="true"><use href="#i-check"/></svg>Copied'; clearTimeout(b._t); b._t = setTimeout(function () { b.innerHTML = '<svg aria-hidden="true"><use href="#i-copy"/></svg>'; }, 1500); };
      var fallback = function () { var ta = document.createElement('textarea'); ta.value = val; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (err) {} document.body.removeChild(ta); done(); };
      try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(val).then(done, fallback); else fallback(); } catch (err) { fallback(); }
      return;
    }
    if (act === 'brief') { briefOpen = !briefOpen; return render(); }
    if (act === 'restart') return reset(S.key);
    if (act === 'open') { var key = b.getAttribute('data-key'); try { history.replaceState(null, '', '#' + key); } catch (err) {} return reset(key); }
    if (act === 'index') { try { history.replaceState(null, '', location.pathname + location.search); } catch (err) {} return reset(null); }
    if (act === 'to-signup') { S.ident = ''; S.pending = {}; return go('signup'); }
    if (act === 'to-login') { S.loginIdent = S.loginIdent || S.ident || ''; return go('login'); }
    if (act === 'forgot') return go('resetRequest');
    if (act === 'resend') { S.resent = true; return render(); }
    if (act === 'support') { S.beforeSupport = S.screen; return go('support'); }
    if (act === 'back-support') return go(S.beforeSupport || 'landing');
    if (act === 'mfa-pick') { var m = b.getAttribute('data-m'); S.codeValue = ''; S.keyWaiting = false; S.mfaPhoneDraft = null; return go({ sms: 'mfaSms', otp: 'mfaOtp', key: 'mfaKey' }[m]); }
    if (act === 'mfa-options') { clearTimeout(bannerTimer); S.banner = false; S.keyWaiting = false; return go('mfaOptions'); }
    if (act === 'key-go') { S.keyWaiting = true; render(); clearTimeout(bannerTimer); bannerTimer = setTimeout(function () { if (S.screen === 'mfaKey') { S.keyWaiting = false; S.mfaMethod = 'key'; go('mfaDone'); } }, 1800); return; }
    if (act === 'mfa-finish') { saveLastMfa({ method: S.mfaMethod, phone: S.mfaMethod === 'sms' ? S.mfaPhone : null }); return createAccount(); }
    if (act === 'ch-other') { S.chPicking = true; S.keyWaiting = false; clearTimeout(bannerTimer); return render(); }
    if (act === 'ch-back') { S.chPicking = false; return render(); }
    if (act === 'ch-pick') { var cm = b.getAttribute('data-m'); S.challenge = { method: cm, phone: S.challenge.phone || S.match.phone }; S.chPicking = false; S.codeValue = ''; S.fieldErr = ''; return render(); }
    if (act === 'ch-key') { S.keyWaiting = true; render(); clearTimeout(bannerTimer); bannerTimer = setTimeout(function () { if (S.screen === 'mfaChallenge') { S.keyWaiting = false; login(S.match); } }, 1800); return; }
    if (act === 'fill-code') { S.codeValue = CODES.sms; S.codeFilled = true; return render(); }
    if (act === 'open-mail') return go('mail');
    if (act === 'back-verify') { S.banner = false; S.screen = 'verify'; return render(); }
    if (act === 'accept') { S.invite = true; S.pending = { email: WORK }; S.inv = {}; S.invErr = {}; return go('inviteDetails'); }
    if (act === 'settings') { S.settingsMsg = ''; S.settingsDraft = ''; return go('settings'); }
    if (act === 'home') return go('home');
    if (act === 'request') return go('requested');
    if (act === 'toggle-pw') { var inp = document.getElementById(b.getAttribute('data-for')); var show = inp.type === 'password'; inp.type = show ? 'text' : 'password'; b.textContent = show ? 'Hide' : 'Show'; b.setAttribute('aria-pressed', show ? 'true' : 'false'); return; }
  });

  // Format phone numbers as (555) 555-0123 while typing: always in phone fields, and in the
  // combined field whenever what's typed so far looks like a phone number (no letters or @).
  function formatPhone(v) {
    var d = String(v).replace(/\D/g, ''); if (d.length === 11 && d[0] === '1') d = d.slice(1); d = d.slice(0, 10);
    if (!d) return '';
    if (d.length <= 3) return '(' + d;
    if (d.length <= 6) return '(' + d.slice(0, 3) + ') ' + d.slice(3);
    return '(' + d.slice(0, 3) + ') ' + d.slice(3, 6) + '-' + d.slice(6);
  }
  app.addEventListener('input', function (e) {
    var t = e.target; if (t.tagName !== 'INPUT') return;
    var isTel = t.type === 'tel', isCombined = t.id === 'ident';
    if (!isTel && !(isCombined && /^[\d\s()+.-]*$/.test(t.value) && /\d/.test(t.value))) return;
    if (e.inputType && e.inputType.indexOf('delete') === 0) return; // let backspace work naturally
    var f = formatPhone(t.value); if (f !== t.value) t.value = f;
  });
  app.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' || e.isComposing) return;
    var t = e.target; if (t.tagName !== 'INPUT') return;
    var form = t.closest('form'); if (!form) return;
    e.preventDefault(); onSubmit(form);
  });
  app.addEventListener('submit', function (e) { e.preventDefault(); onSubmit(e.target); });
  function onSubmit(form) {
    var f = form.getAttribute('data-form');
    var input = form.querySelector('.a0-input:not([readonly]), .input');
    var v = input ? input.value : '';
    S.alert = ''; S.fieldErr = '';
    if (f === 'signup') {
      S.ident = v; S.idType = kind(v);
      if (!S.idType) { S.fieldErr = 'Enter a valid phone number or email.'; return render(); }
      if (find(S.idType, v)) { S.loginIdent = v.trim(); S.alert = 'You already have a Quillmont account. Log in with it to continue to ' + appName() + '.'; return render(); }
      S.pending = {}; S.pending[S.idType] = S.idType === 'phone' ? digits(v) : v.trim(); if (S.idType === 'phone') S.pending.phoneRaw = v;
      S.pwDraft = ''; return go('signupPw');
    }
    if (f === 'signupPw') {
      var pw = document.getElementById('pw').value, pw2 = document.getElementById('pw2').value;
      S.pwDraft = pw;
      if (!pwOk(pw)) { S.policyBad = true; return render(); }
      if (pw !== pw2) { S.fieldErr = 'Passwords do not match.'; return render(); }
      if (S.invite) return go('mfaOptions'); // the invite link already proved the email
      S.otpChannel = S.idType === 'phone' ? 'sms' : 'email'; return startVerify('identifier');
    }
    if (f === 'verify') {
      if (v.trim() !== CODE) { S.codeValue = v; S.fieldErr = 'The code you entered is invalid.'; return render(); }
      if (S.verifyPurpose === 'mfa') { S.mfaMethod = 'sms'; return go('mfaDone'); }
      return go('mfaOptions');
    }
    if (f === 'mfaSms') {
      S.mfaPhoneDraft = v;
      if (kind(v) !== 'phone') { S.fieldErr = 'Enter a valid phone number.'; return render(); }
      S.mfaPhone = digits(v); return startVerify('mfa');
    }
    if (f === 'mfaChallenge') {
      if (v.trim() !== CODE) { S.codeValue = v; S.fieldErr = 'The code you entered is invalid.'; return render(); }
      return login(S.match);
    }
    if (f === 'mfaOtp') {
      if (v.trim() !== CODE) { S.codeValue = v; S.fieldErr = 'The code you entered is invalid.'; return render(); }
      S.mfaMethod = 'otp'; return go('mfaDone');
    }
    if (f === 'login') {
      S.loginIdent = v; var t2 = kind(v);
      if (!t2) { S.fieldErr = 'Enter a valid phone number or email.'; return render(); }
      S.match = find(t2, v); return go('loginPw');
    }
    if (f === 'loginPw') {
      if (!v) { S.fieldErr = 'Enter your password.'; return render(); }
      if (!S.match || !S.match.mine) { S.alert = 'Wrong email or password'; return render(); }
      S.challenge = mfaFor(S.match); S.chPicking = false; S.keyWaiting = false; S.codeValue = '';
      return go('mfaChallenge');
    }
    if (f === 'resetRequest') {
      if (kind(v) !== 'email') { S.fieldErr = 'Email is not valid.'; return render(); }
      S.resetEmail = v.trim(); S.resent = false; return go('resetEmail');
    }
    if (f === 'acceptInvite') { S.pwDraft = ''; return go('signupPw'); }
    if (f === 'inviteDetails') {
      var gv = function (id) { return document.getElementById(id); };
      var inv = { first: gv('inv-first').value.trim(), last: gv('inv-last').value.trim(), middle: gv('inv-middle').value.trim(), mobile: gv('inv-mobile').value, terms: gv('inv-terms').checked, marketing: gv('inv-marketing').checked };
      var d = digits(inv.mobile), er = { first: !inv.first, last: !inv.last, mobile: d.length !== 10, terms: !inv.terms };
      S.inv = inv;
      if (er.first || er.last || er.mobile || er.terms) { S.invErr = er; return render(); }
      var owner = find('phone', d);
      if (owner) { S.invErr = { taken: true }; return render(); }
      S.invErr = {}; S.pending.phone = d; return go('acceptInvite');
    }
    if (f === 'settingsadd') {
      var need = !S.current.phone ? 'phone' : 'email';
      S.settingsDraft = v;
      if (kind(v) !== need) { S.settingsMsg = 'invalid'; return render(); }
      var taken = find(need, v);
      if (taken && taken !== S.current) { S.settingsMsg = 'taken'; return render(); }
      if (need === 'phone') S.current.phone = digits(v); else S.current.email = v.trim();
      S.settingsMsg = ''; S.settingsDraft = ''; return render();
    }
  }

  function fromHash() { var k = (location.hash || '').slice(1); reset(SCENARIOS[k] ? k : null); }
  window.addEventListener('hashchange', fromHash);
  fromHash();
})();
</script>
